name: project-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q scripts tests app
      - name: Install checker PDF dependency
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt
      - name: Regenerate corpus
        run: python scripts/generate_dataset.py
      - name: Validate dataset
        run: python scripts/validate_dataset.py
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run checker tests
        working-directory: app
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
      - name: Build complete release manifest
        run: python scripts/release_manifest.py
      - name: Refresh production readiness report
        run: python scripts/production_readiness.py
      - name: Refresh manifest after generated reports
        run: python scripts/release_manifest.py
      - name: Verify generated artifacts are committed
        run: git diff --exit-code
      - name: Build and verify release
        if: matrix.python-version == '3.12'
        run: python scripts/build_release.py
